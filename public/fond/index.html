<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Адмінка — Тил Душі</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/fond/app.css">
</head>
<body>
    <div class="login" id="login" hidden>
        <form class="login__card" id="loginForm">
            <img src="/images/logo.png" alt="" class="login__logo">
            <h1>Адмінка «Тил Душі»</h1>
            <p class="login__hint" id="loginHint"></p>
            <label>Логін<input name="login" autocomplete="username" required></label>
            <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="btn btn--primary" type="submit">Увійти</button>
            <p class="login__error" id="loginError" role="alert"></p>
        </form>
    </div>

    <div class="app" id="app" hidden>
        <aside class="sidebar">
            <a class="sidebar__brand" href="/" target="_blank" rel="noopener">
                <img src="/images/logo.png" alt=""><span>Тил Душі</span>
            </a>
            <nav class="sidebar__nav" id="sidebarNav">
                <a href="#/list/pending" data-route="pending"><i class="fas fa-inbox"></i>На перевірці<b data-count="pending"></b></a>
                <a href="#/list/approved" data-route="approved"><i class="fas fa-circle-check"></i>Опубліковані<b data-count="approved"></b></a>
                <a href="#/featured" data-route="featured"><i class="fas fa-star"></i>Топ<b data-count="featured"></b></a>
                <a href="#/list/hidden" data-route="hidden"><i class="fas fa-eye-slash"></i>Приховані<b data-count="hidden"></b></a>
                <a href="#/list/rejected" data-route="rejected"><i class="fas fa-ban"></i>Відхилені<b data-count="rejected"></b></a>
                <a href="#/list/rejected_auto" data-route="rejected_auto"><i class="fas fa-robot"></i>Відсіяні ботом<b data-count="rejected_auto"></b></a>
                <a href="#/list/registry" data-route="registry"><i class="fas fa-database"></i>Реєстр (черга бота)<b data-count="registry"></b></a>
                <a href="#/list/all" data-route="all"><i class="fas fa-list"></i>Усі</a>
                <hr>
                <a href="#/new" data-route="new"><i class="fas fa-plus"></i>Додати організацію</a>
                <a href="#/runs" data-route="runs"><i class="fas fa-clock-rotate-left"></i>Журнал бота</a>
            </nav>
            <button class="sidebar__logout" id="logout" type="button"><i class="fas fa-right-from-bracket"></i>Вийти</button>
        </aside>
        <main class="main" id="view"></main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.7/Sortable.min.js"></script>
    <script src="/fond/app.js"></script>
</body>
</html>
